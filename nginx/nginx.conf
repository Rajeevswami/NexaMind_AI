events {}
http {
  client_max_body_size 20M;
  upstream django_backend { server django:8000; }
  server { listen 80;
    location / { proxy_pass http://django_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /media/ { alias /app/media/; }
    location /static/ { alias /app/staticfiles/; }
  }
}

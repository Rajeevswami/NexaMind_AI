<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="320" fill="#0d1117"/>
  <text x="600" y="38" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">Document → RAG Retrieval Pipeline</text>

  <!-- steps -->
  <g>
    <rect x="30" y="110" width="150" height="90" rx="12" fill="#21262d" stroke="#30363d"/>
    <text x="105" y="145" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Upload</text>
    <text x="105" y="165" text-anchor="middle" fill="#8b949e" font-size="11">PDF / DOCX / TXT</text>
  </g>

  <g>
    <rect x="210" y="110" width="150" height="90" rx="12" fill="#0c7d72"/>
    <text x="285" y="145" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Extract</text>
    <text x="285" y="165" text-anchor="middle" fill="#e3fbf8" font-size="11">PyMuPDF · python-docx</text>
  </g>

  <g>
    <rect x="390" y="110" width="150" height="90" rx="12" fill="#0c7d72"/>
    <text x="465" y="145" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Chunk</text>
    <text x="465" y="165" text-anchor="middle" fill="#e3fbf8" font-size="11">text_splitter.py</text>
  </g>

  <g>
    <rect x="570" y="110" width="150" height="90" rx="12" fill="#0c7d72"/>
    <text x="645" y="145" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Embed</text>
    <text x="645" y="165" text-anchor="middle" fill="#e3fbf8" font-size="11">Sentence Transformers</text>
  </g>

  <g>
    <rect x="750" y="110" width="150" height="90" rx="12" fill="#2c4380"/>
    <text x="825" y="145" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Store</text>
    <text x="825" y="165" text-anchor="middle" fill="#dce5f7" font-size="11">Qdrant (user_id filter)</text>
  </g>

  <g>
    <rect x="930" y="110" width="240" height="90" rx="12" fill="#245f2e"/>
    <text x="1050" y="140" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Retrieve + Answer</text>
    <text x="1050" y="162" text-anchor="middle" fill="#eafaf0" font-size="11">retriever.py → Claude → cited answer</text>
  </g>

  <line x1="180" y1="155" x2="208" y2="155" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="360" y1="155" x2="388" y2="155" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="540" y1="155" x2="568" y2="155" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="720" y1="155" x2="748" y2="155" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="900" y1="155" x2="928" y2="155" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="600" y="255" text-anchor="middle" fill="#8b949e" font-size="12">Every retrieval call is scoped to the requesting user — no cross-user document leakage.</text>
</svg>

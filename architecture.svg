<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <linearGradient id="djangoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f7a3b"/>
      <stop offset="100%" stop-color="#245f2e"/>
    </linearGradient>
    <linearGradient id="fastapiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f9d8f"/>
      <stop offset="100%" stop-color="#0c7d72"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c5aa6"/>
      <stop offset="100%" stop-color="#2c4380"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#0d1117"/>
  <text x="600" y="42" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700">NexaMind AI — System Architecture</text>
  <text x="600" y="68" text-anchor="middle" fill="#8b949e" font-size="14">Django web app + isolated FastAPI AI/RAG service</text>

  <!-- Browser -->
  <rect x="40" y="120" width="200" height="90" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="140" y="155" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="600">Browser</text>
  <text x="140" y="178" text-anchor="middle" fill="#8b949e" font-size="12">Chat UI · Auth · Uploads</text>

  <!-- Django -->
  <rect x="330" y="100" width="270" height="200" rx="14" fill="url(#djangoGrad)"/>
  <text x="465" y="132" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Django Web App</text>
  <text x="465" y="154" text-anchor="middle" fill="#e6f4ea" font-size="12">Templates · Tailwind · Alpine.js</text>
  <rect x="352" y="168" width="226" height="26" rx="6" fill="#1f5c2a"/>
  <text x="465" y="185" text-anchor="middle" fill="#eafaf0" font-size="12">accounts · auth &amp; sessions</text>
  <rect x="352" y="200" width="226" height="26" rx="6" fill="#1f5c2a"/>
  <text x="465" y="217" text-anchor="middle" fill="#eafaf0" font-size="12">documents · secure uploads</text>
  <rect x="352" y="232" width="226" height="26" rx="6" fill="#1f5c2a"/>
  <text x="465" y="249" text-anchor="middle" fill="#eafaf0" font-size="12">chat · dashboard</text>
  <text x="465" y="282" text-anchor="middle" fill="#dff3e3" font-size="11">Owner-scoped queries · X-Internal-Api-Key client</text>

  <!-- FastAPI -->
  <rect x="670" y="100" width="290" height="200" rx="14" fill="url(#fastapiGrad)"/>
  <text x="815" y="132" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">FastAPI AI Service</text>
  <text x="815" y="154" text-anchor="middle" fill="#e3fbf8" font-size="12">Claude LLM · RAG · Agents</text>
  <rect x="692" y="168" width="246" height="26" rx="6" fill="#0a675f"/>
  <text x="815" y="185" text-anchor="middle" fill="#eafffb" font-size="12">llm · Anthropic Claude client</text>
  <rect x="692" y="200" width="246" height="26" rx="6" fill="#0a675f"/>
  <text x="815" y="217" text-anchor="middle" fill="#eafffb" font-size="12">rag · chunk → embed → retrieve</text>
  <rect x="692" y="232" width="246" height="26" rx="6" fill="#0a675f"/>
  <text x="815" y="249" text-anchor="middle" fill="#eafffb" font-size="12">agents · resume · study · career</text>
  <text x="815" y="282" text-anchor="middle" fill="#d9fbf6" font-size="11">Validates X-Internal-Api-Key on every request</text>

  <!-- Databases -->
  <rect x="330" y="380" width="270" height="90" rx="12" fill="url(#dataGrad)"/>
  <text x="465" y="415" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">PostgreSQL / SQLite</text>
  <text x="465" y="438" text-anchor="middle" fill="#dce5f7" font-size="12">Users · Documents · Chat history</text>

  <rect x="670" y="380" width="290" height="90" rx="12" fill="url(#dataGrad)"/>
  <text x="815" y="415" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Qdrant Vector Store</text>
  <text x="815" y="438" text-anchor="middle" fill="#dce5f7" font-size="12">Embeddings filtered by user_id</text>

  <rect x="990" y="380" width="170" height="90" rx="12" fill="#5a4a8a"/>
  <text x="1075" y="415" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Redis</text>
  <text x="1075" y="438" text-anchor="middle" fill="#e8e3f5" font-size="12">Cache · rate limits</text>

  <!-- Anthropic -->
  <rect x="990" y="100" width="170" height="90" rx="12" fill="#3a3a3a" stroke="#565656" stroke-width="1.5"/>
  <text x="1075" y="135" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Anthropic</text>
  <text x="1075" y="155" text-anchor="middle" fill="#cfcfcf" font-size="12">Claude API</text>

  <!-- Nginx / Docker footer -->
  <rect x="40" y="520" width="1120" height="60" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="600" y="555" text-anchor="middle" fill="#8b949e" font-size="13">Deployment: Docker Compose orchestrates Django (Gunicorn) · FastAPI (Uvicorn) · Nginx reverse proxy · PostgreSQL · Redis · Qdrant</text>

  <!-- Arrows -->
  <line x1="240" y1="165" x2="328" y2="165" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="284" y="155" text-anchor="middle" fill="#8b949e" font-size="10">HTTPS</text>

  <line x1="600" y1="180" x2="668" y2="180" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="634" y="170" text-anchor="middle" fill="#8b949e" font-size="10">internal API</text>

  <line x1="960" y1="150" x2="988" y2="145" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="465" y1="300" x2="465" y2="378" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="815" y1="300" x2="815" y2="378" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="240" x2="1075" y2="378" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

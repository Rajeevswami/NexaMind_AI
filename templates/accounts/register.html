{% extends 'base.html' %}{% block title %}Create account · NexaMind{% endblock %}{% block content %}<section class="mx-auto mt-12 max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-8"><h1 class="text-2xl font-bold">Create your workspace</h1><form method="post" class="mt-6 space-y-4">{% csrf_token %}{% for field in form %}<div><label class="mb-1 block text-sm">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<p class="mt-1 text-sm text-red-400">{{ error }}</p>{% endfor %}</div>{% endfor %}<button class="w-full rounded-lg bg-cyan-400 px-4 py-2 font-semibold text-slate-950">Create account</button></form><p class="mt-5 text-sm text-slate-400">Already registered? <a class="text-cyan-300" href="{% url 'login' %}">Sign in</a>.</p></section>{% endblock %}

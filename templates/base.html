<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}NexaMind AI{% endblock %}</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-100">{% if user.is_authenticated %}<header class="border-b border-slate-800 bg-slate-900"><nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4"><a href="{% url 'dashboard:home' %}" class="font-bold tracking-tight text-cyan-300">NexaMind AI</a><div class="flex items-center gap-5 text-sm text-slate-300"><a href="{% url 'documents:index' %}">Documents</a><a href="{% url 'chat:index' %}">Chat</a><span class="hidden sm:inline">{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-slate-400 hover:text-white">Log out</button></form></div></nav></header>{% endif %}<main class="mx-auto max-w-6xl px-5 py-8">{% if messages %}{% for message in messages %}<div class="mb-4 rounded-lg border border-emerald-800 bg-emerald-950 px-4 py-3 text-emerald-200">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body></html>

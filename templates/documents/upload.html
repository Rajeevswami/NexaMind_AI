{% extends 'base.html' %}{% block content %}<section class="mx-auto max-w-xl"><a href="{% url 'documents:index' %}" class="text-sm text-cyan-300">← Documents</a><h1 class="mt-4 text-3xl font-bold">Upload a document</h1><p class="mt-2 text-slate-400">PDF, DOCX, or TXT · maximum 10 MB</p><form method="post" enctype="multipart/form-data" class="mt-7 rounded-xl border border-dashed border-slate-700 bg-slate-900 p-8">{% csrf_token %}<label class="block text-sm font-medium">Choose file</label>{{ form.file }}{% for error in form.file.errors %}<p class="mt-2 text-sm text-red-400">{{ error }}</p>{% endfor %}<button class="mt-6 rounded-lg bg-cyan-400 px-4 py-2 font-semibold text-slate-950">Upload document</button></form></section>{% endblock %}
